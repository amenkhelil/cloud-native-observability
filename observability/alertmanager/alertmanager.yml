global:
  resolve_timeout: 5m

route:
  receiver: project-webhook
  group_by:
    - alertname
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 30m

receivers:
  - name: project-webhook
    webhook_configs:
      - url: "http://service-a:8080/admin/alertmanager"
        send_resolved: true
