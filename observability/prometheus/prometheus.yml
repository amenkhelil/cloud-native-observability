global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: service-a
    static_configs:
      - targets:
          - service-a:8080
  - job_name: service-b
    static_configs:
      - targets:
          - service-b:8081
